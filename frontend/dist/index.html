    <!-- Tema terang/gelap dipasang SEBELUM halaman tergambar, supaya mode gelap
         tidak berkedip putih. Kunci dan nilainya = inti/frontend/lib/tema.ts (dijaga
         tema.test.ts); sesudah React menyala, hooks/useTema.ts mengambil alih. -->
    <script>
      (function () {
        var tema = null;
        try {
          tema = localStorage.getItem('tema-tampilan');
        } catch (e) {}
        if (tema !== 'gelap' && tema !== 'terang') {
          tema = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'gelap' : 'terang';
        }
        document.documentElement.dataset.theme = tema === 'gelap' ? 'dark' : 'light';
      })();
    </script>
